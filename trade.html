
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoX Demo Trading</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      background: #111827;
      border-bottom: 1px solid #273244;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #f5b700;
    }

    .demo {
      background: #1d3b2a;
      color: #48e58a;
      border: 1px solid #2f704b;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 14px;
    }

    nav a {
      color: #aeb8c8;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 7px;
      white-space: nowrap;
    }

    nav a.active,
    nav a:hover {
      background: #202b3d;
      color: #ffffff;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 16px;
    }

    .market {
      background: #111827;
      border: 1px solid #273244;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .pair {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .pair-name {
      font-size: 21px;
      font-weight: bold;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      margin-top: 7px;
    }

    .change {
      color: #36d47c;
      margin-top: 5px;
      font-size: 14px;
    }

    .chart {
      height: 280px;
      margin-top: 18px;
      background: #080c14;
      border: 1px solid #202a3a;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(#182131 1px, transparent 1px),
        linear-gradient(90deg, #182131 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .candles {
      position: absolute;
      inset: 15px;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .candle {
      width: 7px;
      position: relative;
      border-radius: 2px;
    }

    .candle::before {
      content: "";
      position: absolute;
      width: 2px;
      left: 3px;
      top: -15px;
      bottom: -15px;
      background: currentColor;
    }

    .green {
      background: #20c878;
      color: #20c878;
    }

    .red {
      background: #ef5350;
      color: #ef5350;
    }

    .trade-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel {
      background: #111827;
      border: 1px solid #273244;
      border-radius: 14px;
      padding: 18px;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .balance {
      background: #182235;
      padding: 14px;
      border-radius: 9px;
      margin-bottom: 15px;
    }

    .balance small {
      color: #9ca8bb;
    }

    .balance strong {
      display: block;
      font-size: 23px;
      margin-top: 5px;
    }

    label {
      display: block;
      color: #9ca8bb;
      font-size: 13px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      background: #080c14;
      border: 1px solid #344055;
      border-radius: 8px;
      color: white;
      outline: none;
      font-size: 16px;
      margin-bottom: 13px;
    }

    input:focus {
      border-color: #557cff;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      padding: 14px;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #16a765;
    }

    .sell {
      background: #dc4545;
    }

    button:active {
      transform: scale(.98);
    }

    .position {
      margin-top: 16px;
      background: #111827;
      border: 1px solid #273244;
      border-radius: 14px;
      padding: 18px;
    }

    .position-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #202a3a;
    }

    .position-row:last-child {
      border-bottom: 0;
    }

    .muted {
      color: #9ca8bb;
    }

    .message {
      margin-top: 12px;
      padding: 11px;
      border-radius: 8px;
      background: #182235;
      color: #cbd5e1;
      font-size: 14px;
      display: none;
    }

    .warning {
      margin-top: 15px;
      color: #8f9bad;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 700px) {
      .trade-box {
        grid-template-columns: 1fr;
      }

      .chart {
        height: 230px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">Crypto<span>X</span></div>
    <div class="demo">DEMO MODE</div>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="markets.html">Markets</a>
    <a class="active" href="trade.html">Trade</a>
    <a href="wallet.html">Wallet</a>
    <a href="history.html">History</a>
  </nav>
</header>

<main>

  <section class="market">
    <div class="pair">
      <div>
        <div class="pair-name">BTC / USDT</div>
        <div class="price" id="price">$67,250.00</div>
        <div class="change">▲ +2.31% Demo Price</div>
      </div>

      <div class="muted">
        Simulated Market
      </div>
    </div>

    <div class="chart">
      <div class="grid"></div>
      <div class="candles" id="candles"></div>
    </div>
  </section>

  <section class="trade-box">

    <div class="panel">
      <h2>Demo Balance</h2>

      <div class="balance">
        <small>Available USDT</small>
        <strong id="balance">$10,000.00</strong>
      </div>

      <label for="amount">Amount (USDT)</label>
      <input
        id="amount"
        type="number"
        min="1"
        step="1"
        placeholder="Enter amount"
      >

      <div class="buttons">
        <button class="buy" onclick="buyBTC()">BUY BTC</button>
        <button class="sell" onclick="sellBTC()">SELL BTC</button>
      </div>

      <div class="message" id="message"></div>

      <div class="warning">
        Demo trading only. No real money or real orders are used.
      </div>
    </div>

    <div class="panel">
      <h2>My Position</h2>

      <div class="position-row">
        <span class="muted">BTC</span>
        <strong id="btc">0.00000000</strong>
      </div>

      <div class="position-row">
        <span class="muted">USDT</span>
        <strong id="usdt">$10,000.00</strong>
      </div>

      <div class="position-row">
        <span class="muted">BTC Value</span>
        <strong id="btcValue">$0.00</strong>
      </div>

      <div class="position-row">
        <span class="muted">Total Demo Equity</span>
        <strong id="equity">$10,000.00</strong>
      </div>
    </div>

  </section>

</main>

<script>
  let price = 67250;
  let usdt = 10000;
  let btc = 0;

  const priceEl = document.getElementById("price");
  const balanceEl = document.getElementById("balance");
  const btcEl = document.getElementById("btc");
  const usdtEl = document.getElementById("usdt");
  const btcValueEl = document.getElementById("btcValue");
  const equityEl = document.getElementById("equity");
  const messageEl = document.getElementById("message");

  function money(value) {
    return "$" + value.toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function updateScreen() {
    priceEl.textContent = money(price);
    balanceEl.textContent = money(usdt);
    usdtEl.textContent = money(usdt);

    const btcValue = btc * price;
    const equity = usdt + btcValue;

    btcEl.textContent = btc.toFixed(8);
    btcValueEl.textContent = money(btcValue);
    equityEl.textContent = money(equity);
  }

  function showMessage(text) {
    messageEl.textContent = text;
    messageEl.style.display = "block";

    setTimeout(function() {
      messageEl.style.display = "none";
    }, 3000);
  }

  function buyBTC() {
    const amount = Number(document.getElementById("amount").value);

    if (!amount || amount <= 0) {
      showMessage("Please enter a valid amount.");
      return;
    }

    if (amount > usdt) {
      showMessage("Not enough Demo USDT.");
      return;
    }

    const received = amount / price;

    usdt -= amount;
    btc += received;

    updateScreen();

    showMessage(
      "Demo BUY successful: " +
      received.toFixed(8) +
      " BTC"
    );
  }

  function sellBTC() {
    const amount = Number(document.getElementById("amount").value);

    if (!amount || amount <= 0) {
      showMessage("Please enter a valid amount.");
      return;
    }

    const btcToSell = amount / price;

    if (btcToSell > btc) {
      showMessage("Not enough Demo BTC.");
      return;
    }

    btc -= btcToSell;
    usdt += amount;

    updateScreen();

    showMessage(
      "Demo SELL successful: " +
      btcToSell.toFixed(8) +
      " BTC"
    );
  }

  function createCandles() {
    const container = document.getElementById("candles");

    for (let i = 0; i < 28; i++) {
      const candle = document.createElement("div");

      const height = 25 + Math.random() * 70;
      candle.style.height = height + "px";

      candle.className =
        Math.random() > 0.48 ? "candle green" : "candle red";

      container.appendChild(candle);
    }
  }

  function simulatePrice() {
    const movement = (Math.random() - 0.5) * 120;

    price += movement;

    if (price < 60000) {
      price = 60000;
    }

    updateScreen();
  }

  createCandles();
  updateScreen();

  setInterval(simulatePrice, 3000);
</script>

</body>
  </html>
