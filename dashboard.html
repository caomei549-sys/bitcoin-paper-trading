<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>สมัครสมาชิก | Bitcoin Paper Trading</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}

.container{

width:95%;
max-width:430px;
background:#1b2435;
padding:35px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.4);

}

.logo{

font-size:32px;
font-weight:bold;
color:#f0b90b;
text-align:center;
margin-bottom:10px;

}

.title{

font-size:26px;
text-align:center;
margin-bottom:30px;

}

.input{

width:100%;
padding:15px;
margin-bottom:18px;
border:none;
border-radius:10px;
background:#2d3b55;
color:white;
font-size:16px;

}

.input::placeholder{

color:#bbb;

}

.button{

width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#f0b90b;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

.button:hover{

background:#ffcf33;

}

.bottom{

margin-top:20px;
text-align:center;

}

.bottom a{

color:#f0b90b;
text-decoration:none;

}

.error{

color:#ff6666;
font-size:14px;
margin-bottom:15px;
display:none;

}

.success{

color:#00ff99;
font-size:14px;
margin-bottom:15px;
display:none;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">₿</div>

<div class="title">
สมัครสมาชิก
  </div>
